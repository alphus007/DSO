name: WordPress WPScan - Automated Vulnerability Discovery & Remediation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_image:
        description: "WP image to scan in the baseline job"
        required: false
        default: "wordpress:5.0-php7.2-apache"
      fail_on_critical:
        description: "Fail the hardened-rescan job if CRITICAL findings remain"
        required: false
        default: "true"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hardened-wordpress
  WP_NET: wp-net

jobs:
  # -----------------------------------------------------------
  # 1) Baseline scan against a deliberately old WordPress image
  # -----------------------------------------------------------
  wpscan-baseline:
    name: "1 - Baseline scan (vulnerable WP)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Create user-defined network
        run: docker network create "$WP_NET"

      - name: Start MySQL 5.7
        run: |
          docker run -d --name wp-db \
            --network "$WP_NET" \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wpuser \
            -e MYSQL_PASSWORD=wppass \
            --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword" \
            --health-interval=5s \
            --health-retries=20 \
            mysql:5.7

      - name: Wait for MySQL to be healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' wp-db 2>/dev/null || echo starting)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              echo "MySQL ready"
              exit 0
            fi
            sleep 5
          done
          echo "MySQL never became healthy"
          docker logs wp-db | tail -50
          exit 1

      - name: Start vulnerable WordPress
        run: |
          docker run -d --name wp-site \
            --network "$WP_NET" \
            -e WORDPRESS_DB_HOST=wp-db:3306 \
            -e WORDPRESS_DB_USER=wpuser \
            -e WORDPRESS_DB_PASSWORD=wppass \
            -e WORDPRESS_DB_NAME=wordpress \
            -p 8080:80 \
            "${{ github.event.inputs.baseline_image || 'wordpress:5.0-php7.2-apache' }}"

      - name: Wait for WordPress to respond
        run: |
          for i in $(seq 1 40); do
            http=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo 000)
            echo "attempt $i: HTTP $http"
            if [ "$http" = "200" ] || [ "$http" = "302" ] || [ "$http" = "301" ]; then
              echo "WordPress is responding"
              exit 0
            fi
            sleep 5
          done
          echo "WordPress never became ready"
          docker logs wp-site | tail -50
          exit 1

      - name: Run WPScan (baseline)
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          mkdir -p scans
          ts=$(date +%Y%m%d_%H%M%S)
          echo "REPORT_JSON=scans/baseline_${ts}.json" >> "$GITHUB_ENV"
          echo "REPORT_TXT=scans/baseline_${ts}.txt"   >> "$GITHUB_ENV"

          token_arg=""
          [ -n "${WPSCAN_API_TOKEN:-}" ] && token_arg="--api-token ${WPSCAN_API_TOKEN}"

          docker run --rm --network host wpscanteam/wpscan:latest \
            --url http://localhost:8080 \
            --enumerate u,vp,vt,tt,cb,dbe \
            --plugins-detection aggressive \
            --random-user-agent \
            --force \
            $token_arg \
            --format json \
            --output "/wpscan/scans/baseline_${ts}.json" \
            -v /workspace || true
          # Run a second time to grab the human-readable output
          docker run --rm --network host wpscanteam/wpscan:latest \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --random-user-agent \
            --force \
            $token_arg \
            2>&1 | tee "scans/baseline_${ts}.txt" || true

      - name: Summarise baseline findings
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          reports = sorted(glob.glob("scans/baseline_*.json"))
          if not reports:
              print("No JSON report produced (WPScan may have failed).")
              sys.exit(0)
          data = json.load(open(reports[-1]))
          wp_ver = data.get("version", {}).get("number", "unknown")
          wp_status = data.get("version", {}).get("status", "unknown")
          print(f"WP core: {wp_ver}  ({wp_status})")
          for k in ("plugins", "themes"):
              items = data.get(k, {}) or {}
              vuln = sum(len(v.get("vulnerabilities", [])) for v in items.values())
              print(f"{k}: {len(items)} found, {vuln} vulnerabilities total")
          users = list((data.get("users") or {}).keys())
          if users:
              print(f"Users enumerated: {users}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wpscan-baseline
          path: scans/baseline_*
          retention-days: 30

      - name: Commit baseline report
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scans/
          git diff --cached --quiet || git commit -m "ci: baseline WPScan results [skip ci]"
          git push || true

  # -----------------------------------------------------------
  # 2) Build & push the hardened image
  # -----------------------------------------------------------
  build-hardened:
    name: "2 - Build & push hardened image"
    runs-on: ubuntu-latest
    needs: wpscan-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/hardened-wordpress', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=hardened-latest
            type=ref,event=branch

      - uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.hardened
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------
  # 3) Re-scan the hardened image and gate on CRITICAL findings
  # -----------------------------------------------------------
  wpscan-hardened:
    name: "3 - Rescan hardened image"
    runs-on: ubuntu-latest
    needs: build-hardened
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create user-defined network
        run: docker network create "$WP_NET"

      - name: Start MySQL 8.0
        run: |
          docker run -d --name wp-db \
            --network "$WP_NET" \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wpuser \
            -e MYSQL_PASSWORD=wppass \
            --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword" \
            --health-interval=5s \
            --health-retries=20 \
            mysql:8.0

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' wp-db 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker logs wp-db | tail -50
          exit 1

      - name: Start hardened WordPress
        run: |
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:hardened-latest
          docker run -d --name wp-site \
            --network "$WP_NET" \
            -e WORDPRESS_DB_HOST=wp-db:3306 \
            -e WORDPRESS_DB_USER=wpuser \
            -e WORDPRESS_DB_PASSWORD=wppass \
            -e WORDPRESS_DB_NAME=wordpress \
            -p 8080:80 \
            ghcr.io/${{ env.IMAGE_NAME }}:hardened-latest

      - name: Wait for WordPress
        run: |
          for i in $(seq 1 40); do
            http=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo 000)
            if [ "$http" = "200" ] || [ "$http" = "302" ] || [ "$http" = "301" ]; then exit 0; fi
            sleep 5
          done
          docker logs wp-site | tail -50
          exit 1

      - name: Run WPScan (hardened)
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          mkdir -p scans
          ts=$(date +%Y%m%d_%H%M%S)
          echo "HARDENED_JSON=scans/hardened_${ts}.json" >> "$GITHUB_ENV"

          token_arg=""
          [ -n "${WPSCAN_API_TOKEN:-}" ] && token_arg="--api-token ${WPSCAN_API_TOKEN}"

          docker run --rm --network host wpscanteam/wpscan:latest \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --plugins-detection aggressive \
            --random-user-agent \
            --force \
            $token_arg \
            --format json \
            --output "/dev/stdout" > "scans/hardened_${ts}.json" || true

          docker run --rm --network host wpscanteam/wpscan:latest \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --random-user-agent \
            --force \
            $token_arg \
            2>&1 | tee "scans/hardened_${ts}.txt" || true

      - name: Gate on remaining CRITICAL findings
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          fail_on = os.environ.get("FAIL_ON_CRITICAL", "true").lower() == "true"
          reports = sorted(glob.glob("scans/hardened_*.json"))
          if not reports:
              print("No hardened report - failing")
              sys.exit(1 if fail_on else 0)
          data = json.load(open(reports[-1]))
          critical = 0
          for section in ("plugins", "themes"):
              for name, info in (data.get(section) or {}).items():
                  for v in info.get("vulnerabilities", []):
                      cvss = (v.get("cvss") or {}).get("score") or 0
                      try:
                          cvss = float(cvss)
                      except (TypeError, ValueError):
                          cvss = 0
                      if cvss >= 9.0:
                          critical += 1
                          print(f"CRITICAL: {section}/{name} - {v.get('title')}")
          # Also fail if core is reported insecure
          status = (data.get("version") or {}).get("status", "")
          if status == "insecure":
              critical += 1
              print("CRITICAL: WP core version reported insecure")
          print(f"Critical findings remaining: {critical}")
          if critical and fail_on:
              sys.exit(1)
          EOF
        env:
          FAIL_ON_CRITICAL: ${{ github.event.inputs.fail_on_critical || 'true' }}

      - uses: actions/upload-artifact@v4
        with:
          name: wpscan-hardened
          path: scans/hardened_*
          retention-days: 30

      - name: Commit hardened report
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scans/
          git diff --cached --quiet || git commit -m "ci: hardened WPScan results [skip ci]"
          git push || true
