# Hardened stack - runs the locally built image from Dockerfile.hardened.
# Build first:    docker build -f Dockerfile.hardened -t wordpress-hardened:local .
# Then:           docker compose -f docker/docker-compose.hardened.yml up -d

services:
  db:
    image: mysql:8.0
    container_name: wp-db-hardened
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wpuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wppass}
    volumes:
      - db_data_h:/var/lib/mysql
    networks:
      - wp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress-hardened:local
    container_name: wp-site-hardened
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wppass}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      # Non-default table prefix shrinks the SQLi attack surface
      WORDPRESS_TABLE_PREFIX: wp_x7k_
    volumes:
      - wp_data_h:/var/www/html
    networks:
      - wp-net

volumes:
  db_data_h:
  wp_data_h:

networks:
  wp-net:
    driver: bridge
